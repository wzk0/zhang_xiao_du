# Reusable: repository checks, actionlint and the host test suite.
#
# It has no triggers of its own — push-main.yml and pull-request-check.yml own
# them and call this file, so the job is defined once.
name: Static checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Repository and host checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore actionlint
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/actionlint
          key: actionlint-${{ hashFiles('tools/install-actionlint.sh') }}

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository and run host tests
        run: ./tools/validate.sh --static