# Everyday push to main: repository checks, actionlint and the host tests.
name: Push to main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: ./.github/workflows/_static-checks.yml