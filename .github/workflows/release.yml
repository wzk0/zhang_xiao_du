name: Release v* firmware

# A v* tag runs the complete gate, verifies the merged image and publishes a
# GitHub Release. Building a branch without publishing lives in
# build-firmware.yml, so nothing here depends on the ref type.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_firmware-build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.run_id }}
          path: release

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "掌小读 ${{ github.ref_name }}"
          generate_release_notes: true
          body_path: release/notes.md
          files: |
            release/FoloToy-AI-Passport-full.bin
            release/FoloToy-AI-Passport.bin
            release/bootloader.bin
            release/partition-table.bin
            release/flash_args
            release/transfer.html
            release/zhangxiaodu-source.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true