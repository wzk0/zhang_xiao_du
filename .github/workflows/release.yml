name: Release v* firmware

# Pushing a v* tag builds the firmware with ESP-IDF 5.5.3, verifies the merged
# image, and publishes a GitHub Release. build-firmware.yml deliberately skips
# v* tags (see its tags filter) so a tag never creates two releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify firmware
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: release-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            release-ccache-${{ github.ref_name }}-
            release-ccache-

      - name: Build and verify merged firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/FoloToy-AI-Passport-full.bin release/
          cp build/FoloToy-AI-Passport.bin release/
          cp build/bootloader/bootloader.bin release/bootloader.bin
          cp build/partition_table/partition-table.bin release/partition-table.bin
          cp build/flash_args release/
          cp assets/web/transfer.html release/
          zip -qr release/zhangxiaodu-source.zip . \
            -x ".git/*" "build/*" "managed_components/*" ".ccache/*" \
               "release/*" ".agents/*" "sdkconfig" "sdkconfig.old"
          (cd release && sha256sum \
            FoloToy-AI-Passport-full.bin FoloToy-AI-Passport.bin \
            bootloader.bin partition-table.bin flash_args transfer.html \
            zhangxiaodu-source.zip > SHA256SUMS.txt)
          ls -lh release

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # Manual dispatch builds and uploads the assets but must not create a
    # release for a branch ref; only a real v* tag is published.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.run_id }}
          path: release

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "掌小读 ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 掌小读 · 电子书阅读器

            Flash `FoloToy-AI-Passport-full.bin` from offset `0x0`; it is the verified
            merged image for the 8 MB ESP32-C3 board. The split images and
            `flash_args` are included for `idf.py flash`, and `SHA256SUMS.txt`
            carries the checksums.

            **What's new / 更新内容**: see the release notes generated from the
            merged pull requests above.

            **How to build / 如何构建**: with ESP-IDF 5.5.3 activated, run
            `./tools/validate.sh --firmware`. It builds the app, merges the
            images at the offsets in `flash_args`, and verifies the 8 MB layout.
            A plain `idf.py build` does not produce or verify the merged image.

            **How to use / 如何使用**: open
            `https://ai-passport.folotoy.cn/tools/web-flasher/`, connect the USB
            cable, select the merged `.bin`, and write it from `0x0`. After boot,
            long-press DOWN while reading to open settings; 接收新书 starts the
            `Passport-Books` hotspot at `http://192.168.4.1` for uploading books.
            `transfer.html` is attached for offline reference, and
            `zhangxiaodu-source.zip` is the complete source tree.
          files: |
            release/FoloToy-AI-Passport-full.bin
            release/FoloToy-AI-Passport.bin
            release/bootloader.bin
            release/partition-table.bin
            release/flash_args
            release/transfer.html
            release/zhangxiaodu-source.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
